name: Update Madison records

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ask-madison-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/ingest.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet data/; then
            echo "No public-record changes found."
            exit 0
          fi
          git config user.name "ask-madison-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh Madison public records"
          git push
